services:
  - type: web
    name: smart-room-api
    runtime: python
    region: singapore
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: smart-room-db
          property: connectionString
      - key: DEVICE_API_KEY
        generateValue: true
      - key: CORS_ORIGINS
        value: "*"

databases:
  - name: smart-room-db
    plan: free
    region: singapore
    databaseName: smart_room
    user: smart_room_user
